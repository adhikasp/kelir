[package]
name = "kelir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, steerable coding-agent harness"
authors = ["kelir contributors"]
readme = "README.md"
repository = "https://github.com/<owner>/kelir"
homepage = "https://github.com/<owner>/kelir"
documentation = "https://docs.rs/kelir"
keywords = ["agent", "cli", "coding", "harness", "tui"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "io-std",
    "time",
    "sync",
    "fs",
    "net",
    "signal",
] }
toml = "0.8"
# STEER-7 round 2: Ed25519 signatures on bg status records. Already compiled
# (rustls' provider), so it adds no code to the binary.
ring = "0.17"
ulid = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
interprocess = { version = "2.4.8", features = ["tokio"] }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    # STEER-7: the session token's randomness (BCryptGenRandom).
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # The concurrency governor's advisory slot locks.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # STEER-7: the session pipe's owner-only DACL, read back to prove it.
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The reviewer's binary (docs/BUILD.md): the same code as release but built to
# be driven, not shipped. Thin LTO and 16 codegen units cut the build from
# minutes to tens of seconds; anything that ships (release above, and the
# binary the live-drive matrix runs) keeps fat LTO and one codegen unit.
[profile.review]
inherits = "release"
lto = "thin"
codegen-units = 16
