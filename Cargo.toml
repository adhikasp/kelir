[package]
name = "kelir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, steerable coding-agent harness"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "io-std",
    "time",
    "sync",
    "fs",
    "net",
    "signal",
] }
toml = "0.8"
ulid = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
interprocess = { version = "2.4.8", features = ["tokio"] }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # The concurrency governor's advisory slot locks.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
