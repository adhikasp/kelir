cargo-features = ["profile-rustflags"]

[package]
name = "kelir"
version = "0.1.0"
edition = "2024"
description = "A small, steerable coding-agent harness"
authors = ["kelir contributors"]
readme = "README.md"
repository = "https://github.com/adhikasp/kelir"
homepage = "https://github.com/adhikasp/kelir"
documentation = "https://docs.rs/kelir"
keywords = ["agent", "cli", "coding", "harness", "tui"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "io-std",
    "time",
    "sync",
    "fs",
    "net",
    "signal",
] }
toml = "1.2"
ulid = "3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
interprocess = { version = "2.4.8", features = ["tokio"] }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # The concurrency governor's advisory slot locks.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # Owner-only DACL for the named pipe and token file.
    "Win32_Security_Authorization",
] }

# Every `#[allow]` becomes an `#[expect(.., reason = "..")]`: an expectation
# that is no longer needed is itself a warning, so the list cannot rot (#23).
# Nightly carries newer `manual_*` lints; they push code onto newer std.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "allow"
missing_debug_implementations = "allow"
unreachable_pub = "allow"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
# Reasoned allow-list. The lints left at `warn` are the ones that push code onto
# newer std (`manual_*`, `redundant_*`) or catch real mistakes (drop tightening).
# These are deliberate non-goals: this crate's API is intentionally broad, its
# docs are prose for CLI readers, and it handles many casts at trusted protocol
# boundaries. Adding a lint here is a decision, not a silence.
assert_is_empty = "allow"
assertions_on_constants = "allow"
assigning_clones = "allow"
bool_to_int_with_if = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
derive_partial_eq_without_eq = "allow"
doc_markdown = "allow"
elidable_lifetime_names = "allow"
equatable_if_let = "allow"
format_collect = "allow"
manual_assert = "allow"
manual_assert_eq = "allow"
manual_is_variant_and = "allow"
missing_fields_in_debug = "allow"
nonminimal_bool = "allow"
option_option = "allow"
return_self_not_must_use = "allow"
single_char_pattern = "allow"
single_option_map = "allow"
stable_sort_primitive = "allow"
struct_field_names = "allow"
suspicious_operation_groupings = "allow"
trivially_copy_pass_by_ref = "allow"
unused_peekable = "allow"
verbose_bit_mask = "allow"
wildcard_imports = "allow"
duration_suboptimal_units = "allow"
explicit_iter_loop = "allow"
format_push_string = "allow"
future_not_send = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
large_futures = "allow"
lint_groups_priority = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
naive_bytecount = "allow"
needless_collect = "allow"
needless_continue = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
redundant_clone = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unchecked_time_subtraction = "allow"
uninlined_format_args = "allow"
unnecessary_lazy_evaluations = "allow"
unnested_or_patterns = "allow"
unreadable_literal = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
large_stack_arrays = "allow"
unnecessary_to_owned = "allow"
needless_pass_by_ref_mut = "allow"
manual_let_else = "allow"
unused_self = "allow"
use_self = "allow"
useless_let_if_seq = "allow"

[lints.cargo]
redundant_homepage = "allow"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
# `-Zopt-level = "z"` plus build-std below: size is the goal of the shipped
# binary, and hot paths opt back to speed with `#[optimize(speed)]` (#23).
opt-level = "z"
# 1.101: no local build paths in the shipped binary (public-repo rule).
trim-paths = "all"
# `cargo install` gets the size-optimised profile (1.101).
# A panic in a tokio task ends the process instead of surfacing as a `JoinError`;
# sessions are crash-durable, so that is the right behaviour for what ships.
panic = "abort"
# `cargo -Z embed-metadata=no` is available in the pinned nightly but Cargo
# already passes its own `-Z embed-metadata`; setting `-C embed-metadata=no`
# here conflicts with it. Leaving metadata on costs nothing in the shipped,
# stripped binary, so no rustflags are needed.

[profile.dev.package.kelir]
opt-level = 1

# Build-std with the size feature is a *release* concern, set in
# `.cargo/config.toml` with `-Z` so it cannot touch a test build.

# Keep file:line in panic backtraces, drop variable/type info: that is most of
# the debug build's time and disk (cold test build 77.5s -> 57.5s, target 3.2 GB
# -> 1.4 GB, PDBs 1.4 GB -> 426 MB; docs/BUILD.md). This is the project default
# so every clone gets it; a machine can still override it in .cargo/config.toml.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The reviewer's binary (docs/BUILD.md): the same code as release but built to
# be driven, not shipped. Thin LTO and 16 codegen units cut the build from
# minutes to tens of seconds; anything that ships (release above, and the
# binary the live-drive matrix runs) keeps fat LTO and one codegen unit.
[profile.review]
inherits = "release"
lto = "thin"
codegen-units = 16
