# Gate settings for cargo-nextest (docs/BUILD.md). `cargo test --lib` stays the
# fast loop for one module; the gates use nextest because it runs every test in
# its own process (a leaked child or a stray thread cannot take another test
# down) and prints which tests needed a retry.
[profile.default]
# A retry is a flake to fix (STEER-9), never a pass: nextest prints `TRY n` and
# the gate script lists every retried test. Two retries ride out a loaded box.
retries = 2
fail-fast = false
# Four concurrent tests per worker; three workers build and test at once on a
# 12-core desktop, and the suites are green serially (BUILD-INFRA rule 1).
test-threads = 4
# Bounds a hang only: a test still running after 4 x 90 s is killed with its
# process tree and reported as timed out. STEER-9 replaced fixed sleeps with
# event-driven waits whose ceilings are >= 60 s, so this is slack.
slow-timeout = { period = "90s", terminate-after = 4 }
