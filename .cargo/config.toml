# Build speed for this repo (BUILD-INFRA, docs/BUILD.md has the numbers).
#
# The debug-info settings are the project default in Cargo.toml
# ([profile.dev]/[profile.test] debug = "line-tables-only"). Only the Windows
# linker stays here: it is a machine-local opt-in, not a source default.
# rust-lld ships inside the Rust toolchain, so no Visual Studio link.exe and no
# vcvars environment are needed, and it links an incremental test binary about
# 11% faster (median 8.4 s vs 9.5 s, n=12 each, docs/BUILD.md). Windows only:
# Linux keeps its default linker (lld there is a separate package).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# Issue #23: the shipped binary is built from source std with the size feature,
# which saves ~450 KB over the stable-flag binary on Linux (9.46 MB -> ~5.0 MB,
# measured on the pinned nightly). It is a *release-only* setting, so tests and
# the dev build keep the toolchain's normal std and `panic = "unwind"`: a test
# must be able to catch a panic. `-Z` requires the pinned nightly, which
# `rust-toolchain.toml` guarantees.
#
# An OS that cannot build std here still ships the stable-flag binary from
# `[profile.release]`; `scripts/release-build.sh` falls back rather than failing.
