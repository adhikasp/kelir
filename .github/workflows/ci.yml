name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No binaries in commit range
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "${#BASE_SHA}" -ne 40 ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base sha; checking only the latest commit."
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          bash scripts/no-binary-check.sh range "$BASE_SHA" "${{ github.sha }}"

      # `rust-toolchain.toml` is the single source of truth; installing from the
      # file on all three OSes keeps the pin authoritative (#23).
      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-21
          components: rustfmt, clippy, rust-src

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --check

      # Cargo's own lint table is `warn`; CI is where warnings fail, so a local
      # `cargo clippy` can still be iterative.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: |
          cargo nextest run --no-fail-fast -j 4
          cargo test --doc
